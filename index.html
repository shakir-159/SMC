<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบข่าวสารและบริการนักเรียน/ครู</title>
  
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { yruPink: '#E66695', yruYellow: '#F3A812' },
          fontFamily: { sarabun: ['Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sarabun min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header Navbar -->
  <header class="bg-white dark:bg-slate-800 shadow-sm sticky top-0 z-40 border-b border-slate-100 dark:border-slate-700">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <span class="font-bold text-lg text-yruPink flex items-center gap-2">
          <i class="fa-solid fa-graduation-cap"></i> Portal System
        </span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>
        
        <div id="userProfileArea" class="flex items-center gap-2 cursor-pointer p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition" onclick="openUserProfileModal()">
          <img id="navAvatar" src="https://via.placeholder.com/150" class="w-8 h-8 rounded-full object-cover border border-yruPink" />
          <span id="navUserName" class="text-xs font-semibold hidden sm:inline-block">ผู้ใช้งาน</span>
        </div>
        
        <button onclick="logout()" class="text-xs text-rose-500 hover:text-rose-600 font-bold px-2 py-1">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Sidebar Overlay & Menu -->
  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-50 hidden opacity-0 transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white dark:bg-slate-800 shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-yruPink text-white">
      <h2 class="font-bold">เมนูการใช้งาน</h2>
      <button onclick="toggleSidebar()" class="text-white hover:text-slate-200"><i class="fa-solid fa-xmark text-xl"></i></button>
    </div>
    <div id="sidebarMenuContainer" class="flex-1 overflow-y-auto p-3 space-y-1">
      <!-- Dynamic Menus -->
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 space-y-4">
    
    <!-- Post Creation Trigger Bar -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-3">
      <img id="createPostAvatar" src="https://via.placeholder.com/150" class="w-10 h-10 rounded-full object-cover border border-yruPink" />
      <button onclick="openCreatePostModal()" class="flex-1 text-left bg-slate-100 dark:bg-slate-700/50 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-400 dark:text-slate-400 rounded-full px-4 py-2.5 text-xs">
        คุณกำลังคิดอะไรอยู่...
      </button>
    </div>

    <!-- Category Filter Bar -->
    <div class="flex gap-2 overflow-x-auto pb-2 text-xs scrollbar-none" id="categoryFilterContainer">
      <button onclick="filterCategory('ทั้งหมด')" class="cat-btn active bg-yruPink text-white px-4 py-1.5 rounded-full font-semibold shadow-sm">ทั้งหมด</button>
      <button onclick="filterCategory('ทั่วไป')" class="cat-btn bg-white dark:bg-slate-800 border dark:border-slate-700 px-4 py-1.5 rounded-full hover:bg-slate-100">ทั่วไป</button>
      <button onclick="filterCategory('ข่าวประกาศ')" class="cat-btn bg-white dark:bg-slate-800 border dark:border-slate-700 px-4 py-1.5 rounded-full hover:bg-slate-100">ข่าวประกาศ</button>
      <button onclick="filterCategory('กิจกรรม')" class="cat-btn bg-white dark:bg-slate-800 border dark:border-slate-700 px-4 py-1.5 rounded-full hover:bg-slate-100">กิจกรรม</button>
    </div>

    <!-- News Feed Posts Container -->
    <div id="postsFeedContainer" class="space-y-4">
      <div class="text-center py-10 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl"></i><p class="mt-2 text-xs">กำลังโหลดข่าวสาร...</p></div>
    </div>
  </main>

  <!-- JavaScript App Logic -->
  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwuwoxbcH8sYL7HjW9fMJrBs-Mmw7YP2JbYrdxl66XyJL28FOiIGaTSXx9QMl54uBimpw/exec"; // วาง Web App URL ที่นี่
    const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";

    let currentUser = null;
    let loadedPostsData = [];
    let currentCategoryFilter = "ทั้งหมด";

    // Initialize System
    window.addEventListener("DOMContentLoaded", () => {
      initTheme();
      checkAuth();
    });

    function checkAuth() {
      const savedUser = localStorage.getItem("app_user");
      if (!savedUser) {
        promptLogin();
      } else {
        currentUser = JSON.parse(savedUser);
        renderUserHeader();
        loadMenus();
        loadPosts();
      }
    }

    function promptLogin() {
      Swal.fire({
        title: "เข้าสู่ระบบ",
        html: `
          <input id="swalId" class="swal2-input text-xs" placeholder="รหัสประจำตัว">
          <input id="swalName" class="swal2-input text-xs" placeholder="ชื่อ - นามสกุล">
        `,
        allowOutsideClick: false,
        confirmButtonText: "เข้าสู่ระบบ",
        confirmButtonColor: "#E66695",
        preConfirm: async () => {
          const userId = document.getElementById("swalId").value.trim();
          const fullName = document.getElementById("swalName").value.trim();
          if (!userId || !fullName) return Swal.showValidationMessage("กรุณากรอกข้อมูลให้ครบถ้วน");

          Swal.showLoading();
          const res = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({ action: "checkLogin", userId, fullName })
          });
          const data = await res.json();
          if (data.success) {
            currentUser = data.userData;
            localStorage.setItem("app_user", JSON.stringify(currentUser));
            return true;
          } else {
            Swal.showValidationMessage(data.message || "ข้อมูลไม่ถูกต้อง");
            return false;
          }
        }
      }).then((res) => {
        if (res.isConfirmed) {
          renderUserHeader();
          loadMenus();
          loadPosts();
        }
      });
    }

    function logout() {
      localStorage.removeItem("app_user");
      location.reload();
    }

    function renderUserHeader() {
      const avatar = currentUser.avatar || DEFAULT_AVATAR;
      document.getElementById("navAvatar").src = avatar;
      document.getElementById("createPostAvatar").src = avatar;
      document.getElementById("navUserName").textContent = currentUser.name;
    }

    // Modal แก้ไขข้อมูลส่วนตัว
    function openUserProfileModal() {
      const avatarSrc = currentUser.avatar || DEFAULT_AVATAR;
      Swal.fire({
        title: "แก้ไขข้อมูลส่วนตัว",
        html: `
          <div class="space-y-3 text-left text-xs">
            <div class="text-center">
              <img id="profilePreviewImg" src="${avatarSrc}" class="w-24 h-24 rounded-full object-cover mx-auto mb-2 border-2 border-yruPink shadow" />
              <input type="file" id="editAvatarFile" accept="image/*" onchange="previewImage(this, 'profilePreviewImg')" class="text-[11px] text-slate-500">
            </div>
            <div>
              <label class="font-semibold text-slate-600 dark:text-slate-300">รหัสประจำตัว</label>
              <input type="text" value="${currentUser.id}" disabled class="w-full p-2 bg-slate-100 dark:bg-slate-700 border dark:border-slate-600 rounded mt-1 text-slate-500">
            </div>
            <div>
              <label class="font-semibold text-slate-600 dark:text-slate-300">ชื่อ - นามสกุล <span class="text-rose-500">*</span></label>
              <input type="text" id="editFullName" value="${currentUser.name || ''}" class="w-full p-2 border dark:bg-slate-700 dark:border-slate-600 rounded mt-1 focus:outline-none focus:border-yruPink" placeholder="กรอกชื่อ-นามสกุล">
            </div>
            <div>
              <label class="font-semibold text-slate-600 dark:text-slate-300">เบอร์โทรศัพท์</label>
              <input type="text" id="editPhone" value="${currentUser.phone || ''}" class="w-full p-2 border dark:bg-slate-700 dark:border-slate-600 rounded mt-1 focus:outline-none focus:border-yruPink" placeholder="กรอกเบอร์โทรศัพท์">
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: "บันทึกข้อมูล",
        confirmButtonColor: "#E66695",
        cancelButtonText: "ยกเลิก",
        preConfirm: async () => {
          const newName = document.getElementById("editFullName").value.trim();
          const newPhone = document.getElementById("editPhone").value.trim();
          const fileInput = document.getElementById("editAvatarFile").files[0];

          if (!newName) {
            Swal.showValidationMessage("กรุณากรอกชื่อ-นามสกุล");
            return false;
          }

          let avatarBase64 = "", avatarName = "";
          if (fileInput) {
            avatarBase64 = await new Promise(r => {
              const reader = new FileReader();
              reader.onload = () => r(reader.result);
              reader.readAsDataURL(fileInput);
            });
            avatarName = fileInput.name;
          }

          Swal.showLoading();
          const res = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "updateUserProfile",
              userId: currentUser.id,
              fullName: newName,
              phone: newPhone,
              avatarBase64: avatarBase64,
              avatarName: avatarName
            })
          });
          const data = await res.json();

          if (data.success) {
            currentUser = data.userData;
            localStorage.setItem("app_user", JSON.stringify(currentUser));
            renderUserHeader();
            loadPosts();
          } else {
            Swal.showValidationMessage(data.message || "บันทึกไม่สำเร็จ");
            return false;
          }
        }
      });
    }

    // Modal สร้างโพสต์ใหม่
    function openCreatePostModal() {
      Swal.fire({
        title: "สร้างโพสต์ข่าวสาร",
        html: `
          <div class="space-y-3 text-left text-xs">
            <textarea id="modalPostContent" rows="3" class="w-full p-2 border rounded focus:border-yruPink dark:bg-slate-700" placeholder="พิมพ์ข้อความที่ต้องการสื่อสาร..."></textarea>
            <div>
              <label class="block font-semibold mb-1">หมวดหมู่</label>
              <select id="modalPostCategory" class="w-full p-2 border rounded dark:bg-slate-700">
                <option value="ทั่วไป">ทั่วไป</option>
                <option value="ข่าวประกาศ">ข่าวประกาศ</option>
                <option value="กิจกรรม">กิจกรรม</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1">แนบรูปภาพ</label>
              <input type="file" id="modalPostImage" accept="image/*" onchange="previewImage(this, 'postImgPreview')" class="w-full text-xs">
              <img id="postImgPreview" class="hidden mt-2 w-full max-h-48 object-cover rounded-lg border" />
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: "โพสต์",
        confirmButtonColor: "#E66695",
        cancelButtonText: "ยกเลิก",
        preConfirm: async () => {
          const content = document.getElementById("modalPostContent").value.trim();
          if (!content) return Swal.showValidationMessage("กรุณากรอกข้อความ");

          const category = document.getElementById("modalPostCategory").value;
          const imageFile = document.getElementById("modalPostImage").files[0];

          let imageBase64 = "", imageName = "";
          if (imageFile) {
            imageBase64 = await new Promise(r => {
              const reader = new FileReader();
              reader.onload = () => r(reader.result);
              reader.readAsDataURL(imageFile);
            });
            imageName = imageFile.name;
          }

          Swal.showLoading();
          await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "createPost",
              userId: currentUser.id,
              authorName: currentUser.name,
              content, category, imageBase64, imageName
            })
          });
        }
      }).then((res) => { if (res.isConfirmed) loadPosts(); });
    }

    // Load News Posts Feed
    async function loadPosts() {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getPosts", categoryFilter: currentCategoryFilter })
      });
      const data = await res.json();

      if (data.success) {
        loadedPostsData = data.posts;
        renderPostsFeed();
      }
    }

    function renderPostsFeed() {
      const container = document.getElementById("postsFeedContainer");
      if (loadedPostsData.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">ยังไม่มีข่าวสารในหมวดหมู่นี้</div>`;
        return;
      }

      container.innerHTML = loadedPostsData.map(post => {
        const isLiked = (post.likes || []).includes(currentUser.id);
        const canManage = post.userId == currentUser.id || ['ADMIN', 'TEACHER'].includes((currentUser.role || '').toUpperCase());
        const authorAvatar = post.authorAvatar || DEFAULT_AVATAR;

        return `
          <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 p-4 space-y-3">
            <!-- Author Header -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <img src="${authorAvatar}" class="w-9 h-9 rounded-full object-cover border border-yruPink" />
                <div>
                  <h4 class="font-bold text-xs leading-none">${post.authorName}</h4>
                  <span class="text-[10px] text-slate-400">${post.createdAt} • <span class="text-yruPink font-semibold">${post.category}</span></span>
                </div>
              </div>
              ${canManage ? `
                <div class="flex gap-2 text-slate-400 text-xs">
                  <button onclick="editPost('${post.postId}', \`${post.content.replace(/`/g, '\\`')}\`, '${post.category}')" class="hover:text-yruPink"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button onclick="deletePost('${post.postId}')" class="hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                </div>
              ` : ''}
            </div>

            <!-- Content -->
            <p class="text-xs leading-relaxed whitespace-pre-line">${formatTextWithLinks(post.content)}</p>
            ${post.imageUrl ? `<img src="${post.imageUrl}" onclick="openImageModal('${post.imageUrl}')" class="w-full max-h-80 object-cover rounded-lg border cursor-pointer hover:opacity-95 transition" />` : ''}

            <!-- Post Actions -->
            <div class="flex items-center justify-between text-xs pt-2 border-t dark:border-slate-700/50 text-slate-500">
              <button onclick="toggleLikePost('${post.postId}')" class="flex items-center gap-1.5 ${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'}">
                <i class="fa-${isLiked ? 'solid' : 'regular'} fa-heart text-sm"></i>
                <span>${(post.likes || []).length} ถูกใจ</span>
              </button>
              <span id="commentCount_${post.postId}" class="text-[11px] text-slate-400">${(post.comments || []).length} ความคิดเห็น</span>
            </div>

            <!-- Comment Input -->
            <div class="pt-2 flex gap-2 items-center">
              <input type="text" id="commentInput_${post.postId}" class="flex-1 p-2 text-xs border rounded-full focus:outline-none focus:border-yruPink dark:bg-slate-700/50 dark:border-slate-600" placeholder="เขียนความคิดเห็น...">
              <button onclick="smoothSubmitComment('${post.postId}')" class="bg-yruPink text-white px-3 py-1.5 rounded-full text-xs font-bold hover:bg-yruPink/90">ส่ง</button>
            </div>

            <!-- Comments Tree -->
            <div id="commentsContainer_${post.postId}" class="space-y-2 pt-2">
              ${renderCommentsTree(post)}
            </div>
          </div>
        `;
      }).join('');
    }

    // Comment Tree Render (รวมฟีเจอร์ถังขยะ + ปุ่มดินสอแก้ไขความคิดเห็น)
    function renderCommentsTree(post, parentId = null) {
      const comments = (post.comments || []).filter(c => (c.parentId || null) === parentId);
      if (comments.length === 0) return '';

      return comments.map(c => {
        const isLiked = (c.likes || []).includes(currentUser.id);
        const canManage = c.userId == currentUser.id || ['ADMIN', 'TEACHER'].includes((currentUser.role || '').toUpperCase());
        const commentAvatar = c.authorAvatar || DEFAULT_AVATAR;

        return `
          <div class="text-xs ${parentId ? 'ml-8 mt-2' : ''} flex gap-2 items-start">
            <img src="${commentAvatar}" class="w-6 h-6 rounded-full object-cover border border-yruPink mt-1" />
            <div class="flex-1 space-y-1">
              <div class="bg-slate-100 dark:bg-slate-700/60 p-2.5 rounded-2xl inline-block max-w-full">
                <strong class="text-yruPink font-bold block text-[11px]">${c.authorName}</strong>
                <span class="text-slate-700 dark:text-slate-200 whitespace-pre-line">${formatTextWithLinks(c.text)}</span>
                ${c.imageUrl ? `<img src="${c.imageUrl}" onclick="openImageModal('${c.imageUrl}')" class="w-32 h-32 object-cover rounded-lg border mt-1 cursor-pointer hover:opacity-90 transition" />` : ''}
              </div>

              <!-- Action Bar: Like, Reply, Edit (Pencil), Delete (Trash) -->
              <div class="flex items-center gap-3 text-[10px] text-slate-400 pl-2">
                <span>${c.time}</span>
                <button onclick="smoothToggleLikeComment('${post.postId}', '${c.commentId}')" class="${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'}">
                  ถูกใจ ${(c.likes || []).length > 0 ? `(${c.likes.length})` : ''}
                </button>
                <button onclick="toggleReplyBox('${c.commentId}')" class="hover:text-yruPink font-semibold">ตอบกลับ</button>
                
                ${canManage ? `
                  <button onclick="smoothEditCommentPrompt('${post.postId}', '${c.commentId}', \`${c.text.replace(/`/g, '\\`')}\`)" class="hover:text-yruPink p-0.5" title="แก้ไขความคิดเห็น">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="smoothDeleteComment('${post.postId}', '${c.commentId}')" class="hover:text-rose-500 p-0.5" title="ลบความคิดเห็น">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                ` : ''}
              </div>

              <!-- Reply Input Box -->
              <div id="replyBox_${c.commentId}" class="hidden flex gap-2 items-center pt-1 pl-2">
                <input type="text" id="replyInput_${c.commentId}" class="flex-1 p-1 text-[11px] border rounded focus:outline-none focus:border-yruPink dark:bg-slate-700" placeholder="ตอบกลับ ${c.authorName}...">
                <button onclick="smoothSubmitComment('${post.postId}', '${c.commentId}')" class="bg-yruPink text-white text-[10px] px-2.5 py-1 rounded font-bold">ส่ง</button>
              </div>

              <!-- Nested Sub-comments -->
              ${renderCommentsTree(post, c.commentId)}
            </div>
          </div>
        `;
      }).join('');
    }

    // Comment Actions (Submit, Edit, Delete, Like)
    async function smoothSubmitComment(postId, parentId = null) {
      const inputId = parentId ? `replyInput_${parentId}` : `commentInput_${postId}`;
      const inputEl = document.getElementById(inputId);
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = "";
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addComment", postId, parentId,
          commentText: text, userId: currentUser.id,
          authorName: currentUser.name, authorAvatar: currentUser.avatar
        })
      });
      const data = await res.json();
      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
        document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
      }
    }

    // ฟังก์ชันเปิด SweetAlert แก้ไขความคิดเห็น
    function smoothEditCommentPrompt(postId, commentId, currentText) {
      Swal.fire({
        title: "แก้ไขความคิดเห็น",
        input: "textarea",
        inputValue: currentText,
        showCancelButton: true,
        confirmButtonText: "บันทึก",
        confirmButtonColor: "#E66695",
        cancelButtonText: "ยกเลิก",
        preConfirm: async (newText) => {
          const text = newText.trim();
          if (!text) return Swal.showValidationMessage("กรุณากรอกข้อความ");

          const res = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "updateComment", postId, commentId,
              commentText: text, userId: currentUser.id, userRole: currentUser.role
            })
          });
          const data = await res.json();
          if (data.success) {
            const post = loadedPostsData.find(p => p.postId === postId);
            post.comments = data.comments;
            document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
          }
        }
      });
    }

    // ฟังก์ชันลบความคิดเห็น (สั่งลบไฟล์รูปใน Drive จากฝั่งหลังบ้าน)
    async function smoothDeleteComment(postId, commentId) {
      if (confirm("ยืนยันการลบความคิดเห็นนี้? (หากมีรูปภาพจะถูกลบออกจากไดรฟ์ด้วย)")) {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "deleteComment", postId, commentId,
            userId: currentUser.id, userRole: currentUser.role
          })
        });
        const data = await res.json();
        if (data.success) {
          const post = loadedPostsData.find(p => p.postId === postId);
          post.comments = data.comments;
          document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
          document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
        }
      }
    }

    async function smoothToggleLikeComment(postId, commentId) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLikeComment", postId, commentId, userId: currentUser.id })
      });
      const data = await res.json();
      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
      }
    }

    async function toggleLikePost(postId) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLike", postId, userId: currentUser.id })
      });
      const data = await res.json();
      if (data.success) loadPosts();
    }

    async function deletePost(postId) {
      if (confirm("คุณแน่ใจหรือไม่ว่าต้องการลบโพสต์นี้? (รูปภาพทั้งหมดในโพสต์จะถูกลบในไดรฟ์)")) {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "deletePost", postId, userId: currentUser.id, userRole: currentUser.role })
        });
        const data = await res.json();
        if (data.success) loadPosts();
      }
    }

    // Load Sidebar Menus (ดึงตาม Role: ADMIN, TEACHER, STUDENT, ALL)
    async function loadMenus() {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getMenus", userRole: currentUser.role })
      });
      const data = await res.json();

      if (data.success) {
        const menuContainer = document.getElementById("sidebarMenuContainer");
        menuContainer.innerHTML = data.menus.map(m => `
          <a href="${m.url}" target="${m.openMode === 'TAB' ? '_blank' : '_self'}" class="flex items-center gap-3 p-2.5 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
            <i class="${m.icon} text-yruPink text-base w-5 text-center"></i>
            <span>${m.name}</span>
          </a>
        `).join('');
      }
    }

    // UI Helpers
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      sidebar.classList.toggle("-translate-x-full");
      overlay.classList.toggle("hidden");
      setTimeout(() => overlay.classList.toggle("opacity-0"), 10);
    }

    function filterCategory(cat) {
      currentCategoryFilter = cat;
      document.querySelectorAll(".cat-btn").forEach(btn => {
        btn.classList.remove("bg-yruPink", "text-white", "shadow-sm");
        btn.classList.add("bg-white", "dark:bg-slate-800");
      });
      event.target.classList.add("bg-yruPink", "text-white", "shadow-sm");
      loadPosts();
    }

    function toggleReplyBox(commentId) {
      const box = document.getElementById(`replyBox_${commentId}`);
      box.classList.toggle("hidden");
    }

    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          preview.src = e.target.result;
          preview.classList.remove("hidden");
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    function openImageModal(url) {
      Swal.fire({ imageUrl: url, imageAlt: 'รูปภาพ', showConfirmButton: false, width: 'auto' });
    }

    function formatTextWithLinks(text) {
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, url => `<a href="${url}" target="_blank" class="text-blue-500 underline hover:text-blue-600 break-all">${url}</a>`);
    }

    function initTheme() {
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById("themeIcon").className = "fa-solid fa-sun text-yruYellow text-lg";
      }
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      document.getElementById("themeIcon").className = isDark ? "fa-solid fa-sun text-yruYellow text-lg" : "fa-solid fa-moon text-lg";
    }
  </script>
</body>
</html>
