<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริการออนไลน์ - YRU Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .bg-yru-pink { background-color: #E66695; }
    .bg-yru-pink-hover { background-color: #d45281; }
    .text-yru-pink { color: #E66695; }
    .border-yru-pink { border-color: #E66695; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-700 flex flex-col justify-between relative overflow-x-hidden">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="text-slate-600 hover:text-slate-900 focus:outline-none p-1">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-400 shadow-sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-xl text-yru-pink tracking-tight">YRU</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="text-lg">🇹🇭</span>

        <div id="notiBellContainer" class="hidden relative">
          <button onclick="toggleNotiDropdown()" class="relative p-1.5 text-slate-500 hover:text-yru-pink focus:outline-none">
            <i class="fa-solid fa-bell text-lg"></i>
            <span id="notiBadge" class="hidden absolute top-0 right-0 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full min-w-[16px] text-center border-2 border-white">0</span>
          </button>

          <div id="notiDropdown" class="hidden absolute right-0 mt-2 w-72 md:w-80 bg-white rounded-xl shadow-xl border border-slate-200 z-50 overflow-hidden">
            <div class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
              <h3 class="font-bold text-xs text-slate-800">การแจ้งเตือน</h3>
              <span class="text-[10px] text-yru-pink font-semibold">ล่าสุด</span>
            </div>
            <div id="notiList" class="max-h-64 overflow-y-auto divide-y divide-slate-100">
              </div>
          </div>
        </div>

        <div id="navUserArea">
          <button onclick="scrollToLogin()" class="bg-yru-pink hover:bg-yru-pink-hover text-white px-4 py-1.5 rounded-md text-sm font-medium transition shadow-sm">
            เข้าสู่ระบบ
          </button>
        </div>
      </div>

    </div>
  </header>

  <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-white z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between">
    <div>
      <div class="p-4 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-sm border border-amber-400">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-2xl text-yru-pink tracking-wide">YRU</span>
        </div>
        <button onclick="toggleSidebar()" class="text-yru-pink text-xl hover:text-slate-400 p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="p-3 space-y-1">
        <a href="#" onclick="toggleSidebar()" class="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:text-yru-pink hover:bg-pink-50 rounded-lg text-sm font-medium transition">
          <i class="fa-solid fa-house text-yru-pink w-5"></i> หน้าแรก
        </a>
        <a href="#" onclick="toggleSidebar()" class="flex items-center gap-3 px-4 py-2.5 bg-yru-pink text-white rounded-lg text-sm font-medium shadow-sm">
          <i class="fa-solid fa-right-to-bracket w-5"></i> เข้าสู่ระบบ
        </a>
      </nav>
    </div>

    <div class="p-4 text-center border-t border-slate-100 text-xs text-slate-500 space-y-1">
      <p class="font-semibold text-slate-700">กรณีที่พบปัญหาการใช้งาน</p>
      <p>ติดต่อได้ที่ <span class="text-slate-800 font-medium">073-299-612</span></p>
    </div>
  </aside>

  <main class="flex-1 max-w-4xl mx-auto w-full p-4 my-4">

    <div id="loginView" class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
      <div class="bg-yru-pink text-white px-5 py-3.5 flex items-center gap-2">
        <i class="fa-solid fa-right-to-bracket text-base"></i>
        <h2 class="font-medium text-sm md:text-base">กรุณาป้อนรหัสประจำตัวและชื่อ-นามสกุล</h2>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">รหัสประจำตัว</label>
          <input type="text" id="loginUserId" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-yru-pink focus:ring-1 focus:ring-yru-pink transition" placeholder="เช่น 6601001">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">ชื่อ - นามสกุล</label>
          <div class="relative">
            <input type="text" id="loginFullName" class="w-full pl-3 pr-10 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-yru-pink focus:ring-1 focus:ring-yru-pink transition" placeholder="เช่น สมชาย ใจดี">
          </div>
        </div>

        <button onclick="handleLogin()" class="bg-yru-pink hover:bg-yru-pink-hover text-white font-medium text-sm px-6 py-2 rounded-md transition shadow-sm">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>

    <div id="registerView" class="hidden max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden border border-slate-200">
      <div class="bg-yru-pink text-white px-5 py-3.5">
        <h2 class="font-medium text-sm">ลงทะเบียนเบอร์โทรศัพท์เพื่อเริ่มต้นใช้งาน</h2>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">เบอร์โทรศัพท์</label>
          <input type="tel" id="regPhone" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-yru-pink focus:ring-1 focus:ring-yru-pink transition" placeholder="08X-XXX-XXXX">
        </div>
        <button onclick="handleRegisterPhone()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm px-6 py-2 rounded-md transition shadow-sm">
          บันทึกข้อมูล
        </button>
      </div>
    </div>

    <div id="dashboardView" class="hidden space-y-6">

      <div id="adminNotiPanel" class="hidden bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-sm font-bold text-yru-pink flex items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> ส่งการแจ้งเตือนด่วน (สำหรับแอดมิน)
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">รูปแบบการส่ง</label>
            <select id="sendTargetType" class="w-full p-2 border rounded-lg text-xs" onchange="toggleTargetInput()">
              <option value="ALL">ส่งถึงทุกคน (Broadcast)</option>
              <option value="ROLE">ส่งตามกลุ่มสิทธิ์ (Role)</option>
              <option value="USER">ส่งตรงรายบุคคล (Private)</option>
            </select>
          </div>
          <div id="targetValueBox" class="hidden">
            <label class="block text-xs font-semibold text-slate-600 mb-1">ระบุเป้าหมาย</label>
            <input type="text" id="sendTargetValue" class="w-full p-2 border rounded-lg text-xs" placeholder="เช่น STUDENT หรือ รหัสนักเรียน">
          </div>
        </div>
        <input type="text" id="sendNotiTitle" class="w-full p-2 border rounded-lg text-xs font-bold" placeholder="หัวข้อแจ้งเตือน">
        <textarea id="sendNotiMessage" rows="2" class="w-full p-2 border rounded-lg text-xs" placeholder="รายละเอียดข้อความ..."></textarea>
        <button onclick="submitNotification()" class="bg-yru-pink hover:bg-yru-pink-hover text-white text-xs font-bold px-4 py-2 rounded-md shadow-sm">ส่งการแจ้งเตือน</button>
      </div>

      <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-sm font-bold mb-4 text-yru-pink flex items-center gap-2">
          <i class="fa-solid fa-grip"></i> เมนูบริการระบบ
        </h2>
        <div id="dynamicMenuGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
      </section>

      <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
        <h2 class="text-sm font-bold text-yru-pink flex items-center gap-2">
          <i class="fa-solid fa-pen-to-square"></i> โพสต์ข่าวประชาสัมพันธ์
        </h2>
        <textarea id="postContent" rows="3" class="w-full p-3 border border-slate-300 rounded-lg text-xs outline-none focus:border-yru-pink" placeholder="เขียนข้อความประชาสัมพันธ์..."></textarea>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">หมวดหมู่</label>
            <select id="postCategory" class="w-full p-2 border border-slate-300 rounded-lg text-xs">
              <option value="ทั่วไป">ทั่วไป</option>
              <option value="ข่าวประกาศ">ข่าวประกาศ</option>
              <option value="กิจกรรม">กิจกรรม</option>
              <option value="ความรู้/สาระ">ความรู้/สาระ</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">แนบรูปภาพ</label>
            <input type="file" id="postImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:bg-pink-50 file:text-yru-pink">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">ลิงก์ไฟล์แนบ (ถ้ามี)</label>
            <input type="url" id="postAttachment" class="w-full p-2 border border-slate-300 rounded-lg text-xs" placeholder="https://...">
          </div>
        </div>
        <button onclick="submitPost()" class="bg-yru-pink hover:bg-yru-pink-hover text-white text-xs font-bold px-5 py-2 rounded-md shadow-sm">โพสต์ข่าวสาร</button>
      </section>

      <section class="space-y-4">
        <div class="flex space-x-2 overflow-x-auto pb-1">
          <button onclick="filterNews('ทั้งหมด')" class="bg-yru-pink text-white px-3 py-1 rounded-full text-xs font-semibold">ทั้งหมด</button>
          <button onclick="filterNews('ข่าวประกาศ')" class="bg-white text-slate-600 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">ข่าวประกาศ</button>
          <button onclick="filterNews('กิจกรรม')" class="bg-white text-slate-600 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">กิจกรรม</button>
          <button onclick="filterNews('ความรู้/สาระ')" class="bg-white text-slate-600 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">ความรู้/สาระ</button>
        </div>
        <div id="newsFeed" class="space-y-4"></div>
      </section>

    </div>

  </main>

  <footer class="p-4 text-xs text-slate-400 max-w-4xl mx-auto w-full">
    <span>@ 2026 <strong class="text-yru-pink font-semibold">Visionnet</strong></span>
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwuwoxbcH8sYL7HjW9fMJrBs-Mmw7YP2JbYrdxl66XyJL28FOiIGaTSXx9QMl54uBimpw/exec"; // <--- เปลี่ยนเป็น Web App URL ของคุณ
    let currentUser = null;
    let currentFilter = "ทั้งหมด";

    window.onload = () => {
      const savedUser = localStorage.getItem("app_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.toggle('hidden');
    }

    function toggleNotiDropdown() {
      document.getElementById('notiDropdown').classList.toggle('hidden');
    }

    function toggleTargetInput() {
      const type = document.getElementById('sendTargetType').value;
      const box = document.getElementById('targetValueBox');
      box.classList.toggle('hidden', type === 'ALL');
    }

    async function handleLogin() {
      const userId = document.getElementById("loginUserId").value.trim();
      const fullName = document.getElementById("loginFullName").value.trim();
      if (!userId || !fullName) return alert("กรุณากรอกรหัสประจำตัวและชื่อ-นามสกุล");

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "checkLogin", userId, fullName })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.userData;
        if (data.registered) {
          localStorage.setItem("app_user", JSON.stringify(currentUser));
          showDashboard();
        } else {
          document.getElementById("loginView").classList.add("hidden");
          document.getElementById("registerView").classList.remove("hidden");
        }
      } else {
        alert(data.message);
      }
    }

    async function handleRegisterPhone() {
      const phone = document.getElementById("regPhone").value.trim();
      if (!phone) return alert("กรุณากรอกเบอร์โทรศัพท์");

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "registerPhone", userId: currentUser.id, phone })
      });
      const data = await res.json();

      if (data.success) {
        currentUser.phone = phone;
        localStorage.setItem("app_user", JSON.stringify(currentUser));
        showDashboard();
      }
    }

    function showDashboard() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("registerView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      document.getElementById("notiBellContainer").classList.remove("hidden");

      document.getElementById("navUserArea").innerHTML = `
        <div class="flex items-center gap-2">
          <span class="text-xs bg-pink-100 text-yru-pink font-bold px-2.5 py-1 rounded-full"><i class="fa-solid fa-user mr-1"></i>${currentUser.name} (${currentUser.role})</span>
          <button onclick="logout()" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-2.5 py-1 rounded-md">ออก</button>
        </div>
      `;

      if (currentUser.role === 'ADMIN') {
        document.getElementById("adminNotiPanel").classList.remove("hidden");
      }

      loadMenus();
      loadPosts();
      loadNotifications();
    }

    async function loadMenus() {
      const grid = document.getElementById("dynamicMenuGrid");
      grid.innerHTML = "<p class='text-xs text-slate-400 col-span-full'>กำลังโหลดเมนู...</p>";

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getMenus", userRole: currentUser.role })
      });
      const data = await res.json();

      if (data.success && data.menus.length > 0) {
        grid.innerHTML = data.menus.map(menu => {
          let link = menu.url;
          if (!menu.isDirect) {
            const sep = link.includes('?') ? '&' : '?';
            link += `${sep}id=${encodeURIComponent(currentUser.id)}`;
          }
          return `
            <a href="${link}" target="_blank" class="flex flex-col items-center p-3 bg-slate-50 hover:bg-pink-50 border border-slate-200 hover:border-yru-pink rounded-xl transition group text-center">
              <div class="w-10 h-10 rounded-lg bg-pink-100 text-yru-pink flex items-center justify-center text-lg mb-1.5 group-hover:bg-yru-pink group-hover:text-white transition">
                <i class="${menu.icon || 'fa-solid fa-link'}"></i>
              </div>
              <span class="font-bold text-xs text-slate-700 group-hover:text-yru-pink">${menu.name}</span>
            </a>
          `;
        }).join('');
      } else {
        grid.innerHTML = "<p class='text-xs text-slate-400 col-span-full'>ไม่มีเมนูสำหรับสิทธิ์ของคุณ</p>";
      }
    }

    async function loadNotifications() {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getUserNotifications", userId: currentUser.id, userRole: currentUser.role })
      });
      const data = await res.json();

      if (data.success) {
        const badge = document.getElementById("notiBadge");
        if (data.unreadCount > 0) {
          badge.textContent = data.unreadCount > 99 ? '99+' : data.unreadCount;
          badge.classList.remove("hidden");
        } else {
          badge.classList.add("hidden");
        }

        const list = document.getElementById("notiList");
        if (data.notifications.length === 0) {
          list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ไม่มีการแจ้งเตือน</p>`;
        } else {
          list.innerHTML = data.notifications.map(item => `
            <div onclick="readNotification('${item.notiId}', ${item.isRead})" class="p-3 hover:bg-slate-50 cursor-pointer transition flex items-start gap-2.5 ${item.isRead ? 'opacity-50' : 'bg-pink-50/40'}">
              <span class="w-2 h-2 rounded-full mt-1.5 inline-block ${item.isRead ? 'bg-transparent' : 'bg-yru-pink'}"></span>
              <div class="flex-1">
                <h4 class="text-xs font-bold text-slate-800">${item.title}</h4>
                <p class="text-xs text-slate-600 mt-0.5 line-clamp-2">${item.message}</p>
                <span class="text-[10px] text-slate-400 mt-1 block">${item.createdAt}</span>
              </div>
            </div>
          `).join('');
        }
      }
    }

    async function readNotification(notiId, isAlreadyRead) {
      if (!isAlreadyRead) {
        await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "markNotiAsRead", userId: currentUser.id, notiId })
        });
        loadNotifications();
      }
    }

    async function submitNotification() {
      const targetType = document.getElementById("sendTargetType").value;
      const targetValue = document.getElementById("sendTargetValue").value.trim();
      const title = document.getElementById("sendNotiTitle").value.trim();
      const message = document.getElementById("sendNotiMessage").value.trim();

      if (!title || !message) return alert("กรุณากรอกหัวข้อและข้อความ");

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendNotification", targetType, targetValue, title, message })
      });
      const data = await res.json();
      if (data.success) {
        alert("ส่งการแจ้งเตือนเรียบร้อย");
        document.getElementById("sendNotiTitle").value = "";
        document.getElementById("sendNotiMessage").value = "";
      }
    }

    async function submitPost() {
      const content = document.getElementById("postContent").value.trim();
      const category = document.getElementById("postCategory").value;
      const attachmentUrl = document.getElementById("postAttachment").value.trim();
      const imageFile = document.getElementById("postImage").files[0];

      if (!content) return alert("กรุณากรอกข้อความประชาสัมพันธ์");

      let imageBase64 = "", imageName = "";
      if (imageFile) {
        imageBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(imageFile);
        });
        imageName = imageFile.name;
      }

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "createPost",
          userId: currentUser.id,
          authorName: currentUser.name,
          content, category, attachmentUrl, imageBase64, imageName
        })
      });
      const data = await res.json();

      if (data.success) {
        alert("โพสต์เรียบร้อยแล้ว");
        document.getElementById("postContent").value = "";
        document.getElementById("postAttachment").value = "";
        document.getElementById("postImage").value = "";
        loadPosts();
      }
    }

    async function loadPosts() {
      const feed = document.getElementById("newsFeed");
      feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>กำลังโหลดข่าวสาร...</p>";

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getPosts", categoryFilter: currentFilter })
      });
      const data = await res.json();

      if (data.success && data.posts.length > 0) {
        feed.innerHTML = data.posts.map(post => `
          <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <div class="flex justify-between items-center">
              <span class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-circle-user text-yru-pink mr-1.5"></i>${post.authorName}</span>
              <span class="bg-pink-100 text-yru-pink text-[10px] px-2.5 py-0.5 rounded-full font-bold">${post.category}</span>
            </div>
            <p class="text-xs text-slate-400">${post.createdAt}</p>
            <p class="text-sm text-slate-700 whitespace-pre-line">${post.content}</p>
            ${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full h-auto rounded-xl border max-h-80 object-cover" />` : ''}
            ${post.attachmentUrl ? `<a href="${post.attachmentUrl}" target="_blank" class="inline-flex items-center text-xs text-yru-pink bg-pink-50 px-3 py-1.5 rounded-lg font-semibold hover:bg-pink-100"><i class="fa-solid fa-paperclip mr-1.5"></i>เปิดเอกสารแนบ</a>` : ''}
          </div>
        `).join('');
      } else {
        feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>ไม่พบข่าวสาร</p>";
      }
    }

    function filterNews(cat) { currentFilter = cat; loadPosts(); }
    function logout() { localStorage.removeItem("app_user"); location.reload(); }
    function scrollToLogin() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  </script>
</body>
</html>
