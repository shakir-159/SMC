<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบออนไลน์ - SMC YRU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { yruPink: '#E66695', yruPinkHover: '#d45281' }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 min-h-screen flex flex-col justify-between relative overflow-x-hidden transition-colors">

  <!-- Header -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="text-slate-600 dark:text-slate-300 hover:text-yruPink focus:outline-none p-1">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        
        <!-- Header University Logo Container -->
        <div id="headerLogoContainer" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-400 shadow-sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-xl text-yruPink tracking-tight">SMC-YRU</span>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-3">
        
        <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-amber-400 hover:text-yruPink focus:outline-none">
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>

        <!-- Notification Bell Container -->
        <div id="notiBellContainer" class="hidden relative">
          <button onclick="toggleNotiDropdown()" class="relative p-1.5 text-slate-500 dark:text-slate-300 hover:text-yruPink focus:outline-none">
            <i class="fa-solid fa-bell text-lg"></i>
            <span id="notiBadge" class="hidden absolute top-0 right-0 bg-rose-500 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full min-w-[16px] text-center border-2 border-white dark:border-slate-800">0</span>
          </button>

          <div id="notiDropdown" class="hidden absolute right-0 mt-2 w-72 md:w-80 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-200 dark:border-slate-700 z-50 overflow-hidden">
            <div class="p-3 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-700">
              <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100">การแจ้งเตือน</h3>
              <span class="text-[10px] text-yruPink font-semibold">ล่าสุด</span>
            </div>
            <div id="notiList" class="max-h-64 overflow-y-auto divide-y divide-slate-100 dark:divide-slate-700"></div>
          </div>
        </div>

        <div id="navUserArea">
          <button onclick="scrollToLogin()" class="bg-yruPink hover:bg-yruPinkHover text-white px-4 py-1.5 rounded-md text-sm font-medium transition shadow-sm">
            เข้าสู่ระบบ
          </button>
        </div>

        <button id="navLogoutBtn" onclick="logout()" class="hidden p-2 text-rose-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 rounded-full transition focus:outline-none" title="ออกจากระบบ">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>

      </div>

    </div>
  </header>

  <!-- Sidebar Overlay & Menu -->
  <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-white dark:bg-slate-800 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-y-auto">
    <div>
      <div class="p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-700">
        
        <!-- Sidebar University Logo Container -->
        <div id="sidebarLogoContainer" class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-sm border border-amber-400">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-2xl text-yruPink tracking-wide">SMC-YRU</span>
        </div>

        <button onclick="toggleSidebar()" class="text-yruPink text-xl hover:text-slate-400 p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="p-3 space-y-1">
        <a href="#" onclick="toggleSidebar()" class="flex items-center gap-3 px-4 py-2.5 text-slate-700 dark:text-slate-200 hover:text-yruPink hover:bg-pink-50 dark:hover:bg-slate-700 rounded-lg text-sm font-bold transition">
          <i class="fa-solid fa-house text-yruPink w-5"></i> หน้าแรก
        </a>

        <div id="sidebarUserMenuSection" class="pt-3 border-t border-slate-100 dark:border-slate-700">
          <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">เมนู</p>
          <div id="sidebarUserMenus" class="space-y-1"></div>
        </div>
      </nav>
    </div>

    <div class="p-4 text-center border-t border-slate-100 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 space-y-1">
      <p class="font-semibold text-slate-700 dark:text-slate-300">กรณีที่พบปัญหาการใช้งาน</p>
      <p>ติดต่อได้ที่ <span class="text-slate-800 dark:text-slate-200 font-medium">095-2200-855</span></p>
    </div>
  </aside>

  <!-- Main View Area -->
  <main class="flex-1 max-w-4xl mx-auto w-full p-4 my-4">

    <!-- Login View -->
    <div id="loginView" class="max-w-md mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-md overflow-hidden border border-slate-200 dark:border-slate-700">
      <div class="bg-yruPink text-white px-5 py-3.5 flex items-center gap-2">
        <i class="fa-solid fa-right-to-bracket text-base"></i>
        <h2 class="font-medium text-sm md:text-base">กรุณาป้อนรหัสประจำตัวและชื่อ-นามสกุล</h2>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">รหัสประจำตัว</label>
          <input type="text" id="loginUserId" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-yruPink" placeholder="เช่น 6601001">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">ชื่อ - นามสกุล</label>
          <input type="text" id="loginFullName" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-yruPink" placeholder="เช่น สมชาย ใจดี">
        </div>

        <button onclick="handleLogin()" class="bg-yruPink hover:bg-yruPinkHover text-white font-medium text-sm px-6 py-2 rounded-md transition shadow-sm">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden space-y-6">

      <!-- Admin Panel -->
      <div id="adminPanel" class="hidden space-y-6">
        
        <!-- Quick Notification Sender Box -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
          <h2 class="text-sm font-bold text-yruPink flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> ส่งการแจ้งเตือนด่วน
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold mb-1">รูปแบบการส่ง</label>
              <select id="sendTargetType" class="w-full p-2 border dark:bg-slate-700 rounded-lg text-xs" onchange="toggleTargetInput()">
                <option value="ALL">ส่งถึงทุกคน (Broadcast)</option>
                <option value="ROLE">ส่งตามกลุ่มสิทธิ์ (Role)</option>
                <option value="USER">ส่งตรงรายบุคคล (Private)</option>
              </select>
            </div>
            <div id="targetValueBox" class="hidden">
              <label class="block text-xs font-semibold mb-1">ระบุเป้าหมาย</label>
              <input type="text" id="sendTargetValue" class="w-full p-2 border dark:bg-slate-700 rounded-lg text-xs" placeholder="STUDENT หรือ User ID">
            </div>
          </div>
          <input type="text" id="sendNotiTitle" class="w-full p-2 border dark:bg-slate-700 rounded-lg text-xs font-bold" placeholder="หัวข้อแจ้งเตือน">
          <textarea id="sendNotiMessage" rows="2" class="w-full p-2 border dark:bg-slate-700 rounded-lg text-xs" placeholder="รายละเอียดข้อความ..."></textarea>
          <button onclick="submitNotification()" class="bg-yruPink hover:bg-yruPinkHover text-white text-xs font-bold px-4 py-2 rounded-md shadow-sm">ส่งการแจ้งเตือน</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-users text-yruPink"></i> จัดการผู้ใช้งาน (Users)</h3>
            <button onclick="openUsersCRUDModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>

          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-bars-staggered text-yruPink"></i> จัดการเมนูระบบ (Menus)</h3>
            <button onclick="openMenusCRUDModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>

          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-newspaper text-yruPink"></i> ตรวจสอบโพสต์ (Posts)</h3>
            <button onclick="openPostsAuditModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>
        </div>

      </div>

      <!-- Service Menu Section -->
      <section id="serviceMenuSection" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
        <button onclick="toggleMenuDrawer()" class="w-full p-4 flex justify-between items-center text-left focus:outline-none bg-slate-50 dark:bg-slate-700/50">
          <h2 class="text-sm font-bold text-yruPink flex items-center gap-2">
            <i class="fa-solid fa-grip"></i> เมนูบริการระบบ
          </h2>
          <i id="menuDrawerIcon" class="fa-solid fa-chevron-up text-xs text-slate-400 transition-transform"></i>
        </button>
        <div id="menuDrawerContent" class="p-5 border-t border-slate-100 dark:border-slate-700">
          <div id="dynamicMenuGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>
      </section>

      <!-- News Feed Section -->
      <section class="space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex space-x-2 overflow-x-auto pb-1">
            <button onclick="filterNews('ทั้งหมด')" class="cat-btn active bg-yruPink text-white px-3 py-1 rounded-full text-xs font-semibold">ทั้งหมด</button>
            <button onclick="filterNews('ข่าวประกาศ')" class="cat-btn bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">ข่าวประกาศ</button>
            <button onclick="filterNews('กิจกรรม')" class="cat-btn bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">กิจกรรม</button>
          </div>
          <button onclick="openCreatePostModal()" class="bg-yruPink hover:bg-yruPinkHover text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> โพสต์ข่าว
          </button>
        </div>

        <div id="newsFeed" class="space-y-4"></div>
      </section>

    </div>

  </main>

  <!-- Footer -->
  <footer class="p-4 text-xs text-slate-400 max-w-4xl mx-auto w-full flex justify-between items-center">
    <span>copyright @ 2026 <strong class="text-yruPink font-semibold">Shakir Title Asha</strong></span>
    <span id="lastUpdateLabel" class="text-[10px]">Last Update: --/--/---- --:--</span>
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwuwoxbcH8sYL7HjW9fMJrBs-Mmw7YP2JbYrdxl66XyJL28FOiIGaTSXx9QMl54uBimpw/exec"; // <--- เปลี่ยนเป็น Web App URL ของคุณ
    const LOGO_URL = ""; // <--- ใส่ลิงค์รูปโลโก้มหาวิทยาลัยตรงนี้ (เช่น "https://www.yru.ac.th/logo.png") หากเว้นว่างไว้จะเป็นไอคอนการศึกษาแทน
    const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/847/847969.png";
    
    let currentUser = null;
    let currentFilter = "ทั้งหมด";
    let loadedPostsData = [];

    window.onload = () => {
      renderLogos();

      const now = new Date();
      document.getElementById("lastUpdateLabel").textContent = "Last Update " + now.toLocaleDateString('th-TH') + " " + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

      const savedUser = localStorage.getItem("app_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    // Render University Logos or Fallback to Graduation Cap Icon
    function renderLogos() {
      const headerContainer = document.getElementById("headerLogoContainer");
      const sidebarContainer = document.getElementById("sidebarLogoContainer");

      if (LOGO_URL && LOGO_URL.trim() !== "") {
        if (headerContainer) {
          headerContainer.innerHTML = `
            <img src="${LOGO_URL}" alt="YRU Logo" class="w-8 h-8 object-contain rounded-full border border-amber-400 shadow-sm" onerror="fallbackLogo(this, 'header')" />
            <span class="font-bold text-xl text-yruPink tracking-tight">YRU</span>
          `;
        }
        if (sidebarContainer) {
          sidebarContainer.innerHTML = `
            <img src="${LOGO_URL}" alt="YRU Logo" class="w-10 h-10 object-contain rounded-full border border-amber-400" onerror="fallbackLogo(this, 'sidebar')" />
            <span class="font-bold text-2xl text-yruPink tracking-wide">YRU</span>
          `;
        }
      } else {
        showDefaultIconLogo(headerContainer, sidebarContainer);
      }
    }

    function fallbackLogo(imgElement, type) {
      const parent = imgElement.parentElement;
      if (!parent) return;
      if (type === 'header') {
        parent.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-400 shadow-sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-xl text-yruPink tracking-tight">YRU</span>
        `;
      } else {
        parent.innerHTML = `
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-sm border border-amber-400">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-2xl text-yruPink tracking-wide">YRU</span>
        `;
      }
    }

    function showDefaultIconLogo(headerContainer, sidebarContainer) {
      if (headerContainer) {
        headerContainer.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-400 shadow-sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-xl text-yruPink tracking-tight">YRU</span>
        `;
      }
      if (sidebarContainer) {
        sidebarContainer.innerHTML = `
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-sm border border-amber-400">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-2xl text-yruPink tracking-wide">YRU</span>
        `;
      }
    }

    // UI Helpers
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.toggle('hidden');
    }

    function toggleNotiDropdown() {
      document.getElementById('notiDropdown').classList.toggle('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById("themeIcon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        icon.className = "fa-solid fa-moon text-lg";
      } else {
        html.classList.add("dark");
        icon.className = "fa-solid fa-sun text-lg text-amber-400";
      }
    }

    function toggleMenuDrawer() {
      document.getElementById("menuDrawerContent").classList.toggle("hidden");
      document.getElementById("menuDrawerIcon").classList.toggle("rotate-180");
    }

    function toggleTargetInput() {
      const type = document.getElementById('sendTargetType').value;
      document.getElementById('targetValueBox').classList.toggle('hidden', type === 'ALL');
    }

    function formatTextWithLinks(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, url => `<a href="${url}" target="_blank" class="text-yruPink font-semibold underline hover:text-yruPinkHover break-all">${url}</a>`);
    }

    function openImageModal(imgSrc) {
      Swal.fire({
        imageUrl: imgSrc,
        imageAlt: 'Preview Image',
        showConfirmButton: false,
        showCloseButton: true,
        background: 'rgba(0, 0, 0, 0.85)',
        customClass: { image: 'max-h-[85vh] rounded-lg object-contain' }
      });
    }

    function previewImage(input, targetImgId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const target = document.getElementById(targetImgId);
          target.src = e.target.result;
          target.classList.remove('hidden');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Login & User Profile
    async function handleLogin() {
      const userId = document.getElementById("loginUserId").value.trim();
      const fullName = document.getElementById("loginFullName").value.trim();
      if (!userId || !fullName) return Swal.fire("แจ้งเตือน", "กรุณากรอกรหัสประจำตัวและชื่อ-นามสกุล", "warning");

      Swal.showLoading();
      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "checkLogin", userId, fullName })
        });
        const data = await res.json();
        Swal.close();

        if (data.success) {
          currentUser = data.userData;
          localStorage.setItem("app_user", JSON.stringify(currentUser));
          showDashboard();
        } else {
          Swal.fire("ข้อผิดพลาด", data.message, "error");
        }
      } catch (err) {
        Swal.close();
        Swal.fire("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อระบบได้", "error");
      }
    }

    function showDashboard() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      document.getElementById("notiBellContainer").classList.remove("hidden");
      document.getElementById("navLogoutBtn").classList.remove("hidden");

      renderUserHeader();

      if (currentUser.role === 'ADMIN') {
        document.getElementById("adminPanel").classList.remove("hidden");
        document.getElementById("serviceMenuSection").classList.add("hidden");
        document.getElementById("sidebarUserMenuSection").classList.add("hidden");
      } else {
        loadMenus();
      }

      loadPosts();
      loadNotifications();
    }

    function renderUserHeader() {
      const avatarSrc = currentUser.avatar || DEFAULT_AVATAR;
      document.getElementById("navUserArea").innerHTML = `
        <button onclick="openUserProfileModal()" class="flex items-center gap-2 bg-pink-50 dark:bg-slate-700 hover:bg-pink-100 p-1.5 pr-3 rounded-full transition border border-pink-200 dark:border-slate-600">
          <img src="${avatarSrc}" class="w-7 h-7 rounded-full object-cover border border-yruPink" />
          <span class="text-xs font-bold text-yruPink">${currentUser.name}</span>
        </button>
      `;
    }

    // Modal Profile + Image Preview + Edit Name & Phone Number
    function openUserProfileModal() {
      const avatarSrc = currentUser.avatar || DEFAULT_AVATAR;
      Swal.fire({
        title: "แก้ไขข้อมูลส่วนตัว",
        html: `
          <div class="space-y-3 text-left text-xs">
            <div class="text-center">
              <img id="profilePreviewImg" src="${avatarSrc}" class="w-24 h-24 rounded-full object-cover mx-auto mb-2 border-2 border-yruPink shadow" />
              <input type="file" id="editAvatarFile" accept="image/*" onchange="previewImage(this, 'profilePreviewImg')" class="text-[11px] text-slate-500">
            </div>
            <div>
              <label class="font-semibold text-slate-600 dark:text-slate-300">รหัสประจำตัว</label>
              <input type="text" value="${currentUser.id}" disabled class="w-full p-2 bg-slate-100 dark:bg-slate-700 border dark:border-slate-600 rounded mt-1 text-slate-500">
            </div>
            <div>
              <label class="font-semibold text-slate-600 dark:text-slate-300">ชื่อ - นามสกุล <span class="text-rose-500">*</span></label>
              <input type="text" id="editFullName" value="${currentUser.name || ''}" class="w-full p-2 border dark:bg-slate-700 dark:border-slate-600 rounded mt-1 focus:outline-none focus:border-yruPink" placeholder="กรอกชื่อ-นามสกุล">

        `,

        confirmButtonText: "บันทึกข้อมูล",
        confirmButtonColor: "#E66695",
        cancelButtonText: "ยกเลิก",
        preConfirm: async () => {
          const newName = document.getElementById("editFullName").value.trim();
          const newPhone = document.getElementById("editPhone").value.trim();
          const fileInput = document.getElementById("editAvatarFile").files[0];

          if (!newName) {
            Swal.showValidationMessage("กรุณากรอกชื่อ-นามสกุล");
            return false;
          }

          let avatarBase64 = "", avatarName = "";
          if (fileInput) {
            avatarBase64 = await new Promise(r => {
              const reader = new FileReader();
              reader.onload = () => r(reader.result);
              reader.readAsDataURL(fileInput);
            });
            avatarName = fileInput.name;
          }

          Swal.showLoading();
          try {
            const res = await fetch(GAS_API_URL, {
              method: "POST",
              body: JSON.stringify({
                action: "updateUserProfile",
                userId: currentUser.id,
                fullName: newName,
                phone: newPhone,
                avatarBase64: avatarBase64,
                avatarName: avatarName
              })
            });
            const data = await res.json();

            if (data.success && data.userData) {
              currentUser = data.userData;
              localStorage.setItem("app_user", JSON.stringify(currentUser));
              renderUserHeader();
              loadPosts(); // โหลดหน้าโพสต์ใหม่เพื่ออัปเดตชื่อ/รูปโปรไฟล์
              Swal.fire({ icon: 'success', title: 'บันทึกข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false });

              Swal.showValidationMessage(data.message || "ไม่สามารถบันทึกข้อมูลได้");
              return false;
            }
          } catch(e) {
            Swal.showValidationMessage("เกิดข้อผิดพลาดในการเชื่อมต่อ");
            return false;
          }
        }
      });

    async function loadMenus() {
      const grid = document.getElementById("dynamicMenuGrid");
      const sidebarNav = document.getElementById("sidebarUserMenus");

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getMenus", userRole: currentUser.role })
        });
        const data = await res.json();

        if (data.success && data.menus.length > 0) {
          grid.innerHTML = data.menus.map(menu => renderMenuButton(menu, false)).join('');
          sidebarNav.innerHTML = data.menus.map(menu => renderMenuButton(menu, true)).join('');
        } else {
          grid.innerHTML = "<p class='text-xs text-slate-400 col-span-full'>ไม่มีเมนูสำหรับสิทธิ์ของคุณ</p>";

      }
    }

    function renderMenuButton(menu, isSidebar) {
      const openMode = (menu.openMode || 'TAB').toUpperCase();
      const isDirect = menu.isDirect;
      const url = menu.url;
      const name = (menu.name || '').replace(/'/g, "\\'");

      if (isSidebar) {
        return `
          <button onclick="openMenuUrl('${url}', ${isDirect}, '${name}', '${openMode}'); toggleSidebar();" class="w-full flex items-center gap-3 px-4 py-2 text-slate-600 dark:text-slate-300 hover:text-yruPink hover:bg-pink-50 dark:hover:bg-slate-700 rounded-lg text-xs font-medium transition text-left">
            <i class="${menu.icon || 'fa-solid fa-link'} text-yruPink w-4"></i> ${menu.name}
          </button>
        `;
      }

      return `
        <button onclick="openMenuUrl('${url}', ${isDirect}, '${name}', '${openMode}')" class="flex flex-col items-center p-3 bg-slate-50 dark:bg-slate-700/50 hover:bg-pink-50 border border-slate-200 dark:border-slate-600 hover:border-yruPink rounded-xl transition group text-center w-full">
          <div class="w-10 h-10 rounded-lg bg-pink-100 text-yruPink flex items-center justify-center text-lg mb-1.5 group-hover:bg-yruPink group-hover:text-white transition">
            <i class="${menu.icon || 'fa-solid fa-link'}"></i>
          </div>
          <span class="font-bold text-xs text-slate-700 dark:text-slate-200 group-hover:text-yruPink">${menu.name}</span>
        </button>
      `;
    }

    function openMenuUrl(url, isDirect, name, openMode) {
      let link = url;
      if (!isDirect) {
        const sep = link.includes('?') ? '&' : '?';
        link += `${sep}id=${encodeURIComponent(currentUser.id)}`;
      }

      if (openMode === 'MODAL') {
        Swal.fire({
          title: name,
          html: `<iframe src="${link}" class="w-full h-[75vh] border-0 rounded-lg"></iframe>`,
          width: '90%',
          showCloseButton: true,
          showConfirmButton: false,
          customClass: { popup: 'p-2 md:p-4' }
        });
      } else {
        window.open(link, '_blank');
      }
    }

    async function loadPosts() {
      const feed = document.getElementById("newsFeed");
      if (loadedPostsData.length === 0) feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>กำลังโหลดข่าวสาร...</p>";

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getPosts", categoryFilter: currentFilter })
        });
        const data = await res.json();

        if (data.success) {
          loadedPostsData = data.posts;
          renderPostsFeed();
        }
      } catch(e) {
        feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>เกิดข้อผิดพลาดในการโหลดข่าวสาร</p>";
      }
    }

    function renderPostsFeed() {
      const feed = document.getElementById("newsFeed");
      if (loadedPostsData.length === 0) {
        feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>ไม่พบข่าวสาร</p>";
        return;
      }

      feed.innerHTML = loadedPostsData.map(post => {
        const uidStr = String(currentUser.id).trim();
        const isLiked = (post.likes || []).some(id => String(id).trim() === uidStr);
        const canManage = String(post.userId).trim() === uidStr || ['ADMIN', 'TEACHER'].includes((currentUser.role || '').toUpperCase());
        const postAvatar = post.authorAvatar || DEFAULT_AVATAR;

        return `
          <div id="postCard_${post.postId}" class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
           
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2.5">
                <img src="${postAvatar}" class="w-9 h-9 rounded-full object-cover border border-yruPink" />
                <div>
                  <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs">${post.authorName}</h4>
                  <p class="text-[10px] text-slate-400">${post.createdAt}</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span class="bg-pink-100 text-yruPink text-[10px] px-2.5 py-0.5 rounded-full font-bold">${post.category}</span>
                ${canManage ? `
                  <button onclick="editPostModal('${post.postId}')" class="text-xs text-slate-400 hover:text-yruPink"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button onclick="deletePostConfirm('${post.postId}')" class="text-xs text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash-can"></i></button>
                ` : ''}
              </div>
            </div>

            <p class="text-xs text-slate-700 dark:text-slate-200 whitespace-pre-line leading-relaxed">${formatTextWithLinks(post.content)}</p>

            ${post.imageUrl ? `
              <img src="${post.imageUrl}" onclick="openImageModal('${post.imageUrl}')" class="w-full h-auto rounded-xl border max-h-96 object-cover cursor-pointer hover:opacity-95 transition" />
            ` : ''}
           
            <div class="pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs text-slate-500">
              <button onclick="smoothToggleLike('${post.postId}')" class="flex items-center gap-1.5 ${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'} transition">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                <span id="likeCount_${post.postId}">${(post.likes || []).length} ถูกใจ</span>
              </button>
              <span class="text-slate-400" id="commentCount_${post.postId}">${(post.comments || []).length} ความคิดเห็น</span>
            </div>

            <div id="commentsContainer_${post.postId}" class="space-y-2 pt-2 border-t border-slate-50 dark:border-slate-700">
              ${renderCommentsTree(post)}
            </div>

            <div class="space-y-2 pt-2">
              <div class="flex gap-2 items-center">
                <img src="${currentUser.avatar || DEFAULT_AVATAR}" class="w-7 h-7 rounded-full object-cover border" />
                <input type="text" id="commentInput_${post.postId}" class="flex-1 p-2 text-xs border dark:bg-slate-700 dark:border-slate-600 rounded-lg focus:outline-none focus:border-yruPink" placeholder="เขียนความคิดเห็น...">
                <label class="cursor-pointer text-slate-400 hover:text-yruPink px-1">
                  <i class="fa-solid fa-image text-base"></i>
                  <input type="file" id="commentImg_${post.postId}" accept="image/*" onchange="previewImage(this, 'commentImgPreview_${post.postId}')" class="hidden">
                </label>
                <button onclick="smoothSubmitComment('${post.postId}')" class="bg-yruPink hover:bg-yruPinkHover text-white text-xs px-3 py-1.5 rounded-lg font-bold transition">ส่ง</button>
              </div>
              <img id="commentImgPreview_${post.postId}" class="hidden w-16 h-16 object-cover rounded-lg border border-yruPink ml-9" />
            </div>

          </div>
        `;
      }).join('');

    function renderCommentsTree(post, parentId = null) {
      const comments = (post.comments || []).filter(c => (c.parentId || null) === parentId);
      if (comments.length === 0) return '';

      const uidStr = String(currentUser.id).trim();

      return comments.map(c => {
        const isLiked = (c.likes || []).some(id => String(id).trim() === uidStr);
        const canManage = String(c.userId).trim() === uidStr || ['ADMIN', 'TEACHER'].includes((currentUser.role || '').toUpperCase());
        const commentAvatar = c.authorAvatar || DEFAULT_AVATAR;

        return `
          <div class="text-xs ${parentId ? 'ml-8 mt-2' : ''} flex gap-2 items-start">
            <img src="${commentAvatar}" class="w-6 h-6 rounded-full object-cover border border-yruPink mt-1" />
            <div class="flex-1 space-y-1">
              <div class="bg-slate-100 dark:bg-slate-700/60 p-2.5 rounded-2xl inline-block max-w-full">
                <strong class="text-yruPink font-bold block text-[11px]">${c.authorName}</strong>
                <span class="text-slate-700 dark:text-slate-200 whitespace-pre-line">${formatTextWithLinks(c.text)}</span>
                ${c.imageUrl ? `<img src="${c.imageUrl}" onclick="openImageModal('${c.imageUrl}')" class="w-32 h-32 object-cover rounded-lg border mt-1 cursor-pointer" />` : ''}
              </div>

              <div class="flex items-center gap-3 text-[10px] text-slate-400 pl-2">
                <span>${c.time}</span>
                <button onclick="smoothToggleLikeComment('${post.postId}', '${c.commentId}')" class="${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'}">
                  ถูกใจ ${(c.likes || []).length > 0 ? `(${c.likes.length})` : ''}
                </button>
                <button onclick="toggleReplyBox('${c.commentId}')" class="hover:text-yruPink font-semibold">ตอบกลับ</button>
                
                ${canManage ? `
                  <button onclick="smoothEditCommentPrompt('${post.postId}', '${c.commentId}', \`${c.text.replace(/`/g, '\\`')}\`)" class="hover:text-yruPink p-0.5" title="แก้ไขความคิดเห็น">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button onclick="smoothDeleteComment('${post.postId}', '${c.commentId}')" class="hover:text-rose-500 p-0.5" title="ลบความคิดเห็น">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                ` : ''}
              </div>

              <div id="replyBox_${c.commentId}" class="hidden flex gap-2 items-center pt-1 pl-2">
                <input type="text" id="replyInput_${c.commentId}" class="flex-1 p-1 text-[11px] border rounded focus:outline-none focus:border-yruPink dark:bg-slate-700" placeholder="ตอบกลับ ${c.authorName}...">
                <button onclick="smoothSubmitComment('${post.postId}', '${c.commentId}')" class="bg-yruPink text-white text-[10px] px-2.5 py-1 rounded font-bold">ส่ง</button>
              </div>

              ${renderCommentsTree(post, c.commentId)}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleReplyBox(commentId) {
      document.getElementById(`replyBox_${commentId}`).classList.toggle('hidden');
    }

    async function smoothToggleLike(postId) {
      const post = loadedPostsData.find(p => p.postId === postId);
      if (!post) return;

      if (!post.likes) post.likes = [];
      const uidStr = String(currentUser.id).trim();
      const idx = post.likes.findIndex(id => String(id).trim() === uidStr);
      if (idx > -1) {
        post.likes.splice(idx, 1);
      } else {
        post.likes.push(uidStr);
      }

      const countLabel = document.getElementById(`likeCount_${postId}`);
      if (countLabel) countLabel.textContent = `${post.likes.length} ถูกใจ`;

      const btn = countLabel ? countLabel.closest('button') : null;
      if (btn) {
        const isNowLiked = post.likes.some(id => String(id).trim() === uidStr);
        const icon = btn.querySelector('i');
        if (isNowLiked) {
          btn.className = "flex items-center gap-1.5 text-rose-500 font-bold transition";
          if (icon) icon.className = "fa-solid fa-heart";
        } else {
          btn.className = "flex items-center gap-1.5 hover:text-rose-500 transition";
          if (icon) icon.className = "fa-regular fa-heart";
        }
      }

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLike", postId, userId: currentUser.id })
      });
    }

    async function smoothSubmitComment(postId, parentId = null) {
      let input, imgInput;
      if (parentId) {
        input = document.getElementById(`replyInput_${parentId}`);
      } else {
        input = document.getElementById(`commentInput_${postId}`);
        imgInput = document.getElementById(`commentImg_${postId}`);
      }

      const text = input.value.trim();
      const imageFile = imgInput ? imgInput.files[0] : null;
      if (!text && !imageFile) return;

      let imageBase64 = "", imageName = "";
      if (imageFile) {
        imageBase64 = await new Promise(r => {
          const reader = new FileReader();
          reader.onload = () => r(reader.result);
          reader.readAsDataURL(imageFile);
        });
        imageName = imageFile.name;
      }

      input.value = "";
      if (imgInput) {
        imgInput.value = "";
        const preview = document.getElementById(`commentImgPreview_${postId}`);
        if (preview) preview.classList.add("hidden");
      }

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addComment", postId, parentId,
          commentText: text, imageBase64, imageName,
          userId: currentUser.id, authorName: currentUser.name, authorAvatar: currentUser.avatar
        })
      });
      const data = await res.json();

      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
        document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
      }
    }

    function smoothEditCommentPrompt(postId, commentId, currentText) {
      Swal.fire({
        title: "แก้ไขความคิดเห็น",
        input: "textarea",
        inputValue: currentText,
        showCancelButton: true,
        confirmButtonText: "บันทึก",
        confirmButtonColor: "#E66695",
        cancelButtonText: "ยกเลิก",
        preConfirm: async (newText) => {
          const text = newText.trim();
          if (!text) return Swal.showValidationMessage("กรุณากรอกข้อความ");

          const res = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "updateComment", postId, commentId,
              commentText: text, userId: currentUser.id, userRole: currentUser.role
            })
          });
          const data = await res.json();
          if (data.success) {
            const post = loadedPostsData.find(p => p.postId === postId);
            post.comments = data.comments;
            document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
          }
        }
      });
    }

    async function smoothDeleteComment(postId, commentId) {
      if (confirm("ยืนยันการลบความคิดเห็นนี้? (หากมีรูปภาพในคอมเมนต์ จะถูกลบออกจาก Google Drive ด้วย)")) {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "deleteComment", postId, commentId,
            userId: currentUser.id, userRole: currentUser.role
          })
        });
        const data = await res.json();

        if (data.success) {
          const post = loadedPostsData.find(p => p.postId === postId);
          post.comments = data.comments;
          document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
          document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
        }
      }
    }

    async function smoothToggleLikeComment(postId, commentId) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLikeComment", postId, commentId, userId: currentUser.id })
      });
      const data = await res.json();

      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
      }
    }

    }

    function editUserPrompt(id, name, phone, status, role, avatar) {

          <div class="space-y-2 text-left text-xs">
            <div><label class="font-bold">User ID</label><input type="text" id="uId" value="${id}" ${id ? 'disabled' : ''} class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
            <div><label class="font-bold">ชื่อ-นามสกุล</label><input type="text" id="uName" value="${name}" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
            <div><label class="font-bold">เบอร์โทรศัพท์</label><input type="text" id="uPhone" value="${phone}" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
            <div><label class="font-bold">สถานะ</label><input type="text" id="uStatus" value="${status}" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
            <div><label class="font-bold">Role</label>
              <select id="uRole" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600">
                <option value="STUDENT" ${role==='STUDENT'?'selected':''}>STUDENT</option>
                <option value="TEACHER" ${role==='TEACHER'?'selected':''}>TEACHER</option>
                <option value="ADMIN" ${role==='ADMIN'?'selected':''}>ADMIN</option>
              </select>
            </div>
            <div><label class="font-bold">Avatar URL</label><input type="text" id="uAvatar" value="${avatar}" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>
          </div>

        showCancelButton: true,

            document.getElementById("uName").value.trim(),

          await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "saveUserAdmin", userData }) });

    async function deleteUserConfirm(userId) {
      if (confirm(`ยืนยันการลบผู้ใช้ ${userId}?`)) {
        await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "deleteUser", userId }) });

      }

    function editMenuPrompt(id, name, icon, url, direct, role, openMode) {

          <div class="space-y-2 text-left text-xs">

            <div><label class="font-bold">Role (เช่น ALL, STUDENT, TEACHER, ADMIN)</label><input type="text" id="mRole" value="${role}" class="w-full p-2 border rounded dark:bg-slate-700 dark:border-slate-600"></div>

    async function deleteMenuConfirm(menuId) {

    async function openPostsAuditModal() {
      Swal.showLoading();
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "getPosts", categoryFilter: "ทั้งหมด" }) });
      const data = await res.json();

      const rowsHtml = data.posts.map(p => `

              <tbody>${rowsHtml}</tbody>

    async function adminDeletePost(postId) {
      if (confirm("แอดมินยืนยันการลบโพสต์นี้หรือไม่?")) {
        await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "deletePost", postId, userId: currentUser.id, userRole: currentUser.role }) });
        openPostsAuditModal();
        loadPosts();
      }
    }

    // Notifications Functions
    async function loadNotifications() {
      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getUserNotifications", userId: currentUser.id, userRole: currentUser.role })
        });
        const data = await res.json();

        if (data.success) {
          const badge = document.getElementById("notiBadge");
          if (data.unreadCount > 0) {
            badge.textContent = data.unreadCount > 99 ? '99+' : data.unreadCount;
            badge.classList.remove("hidden");
          } else {
            badge.classList.add("hidden");
          }

          const list = document.getElementById("notiList");
          if (data.notifications.length === 0) {
            list.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">ไม่มีการแจ้งเตือน</p>`;
          } else {
            list.innerHTML = data.notifications.map(item => `
              <div onclick="openNotiFullModal('${item.notiId}', '${encodeURIComponent(item.title)}', '${encodeURIComponent(item.message)}', '${item.createdAt}', ${item.isRead})" class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700 cursor-pointer transition flex items-start gap-2.5 ${item.isRead ? 'opacity-50' : 'bg-pink-50/40'}">
                <span class="w-2 h-2 rounded-full mt-1.5 inline-block ${item.isRead ? 'bg-transparent' : 'bg-yruPink'}"></span>
                <div class="flex-1">
                  <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">${item.title}</h4>
                  <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5 line-clamp-1">${item.message}</p>
                  <span class="text-[10px] text-slate-400 mt-1 block">${item.createdAt}</span>
                </div>
              </div>
            `).join('');
          }
        }
      } catch(e) {}
    }

    function openNotiFullModal(notiId, encTitle, encMessage, time, isRead) {
      const title = decodeURIComponent(encTitle);
      const message = decodeURIComponent(encMessage);

      if (!isRead) {
        fetch(GAS_API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "markNotiAsRead", userId: currentUser.id, notiId })
        }).then(() => loadNotifications());
      }

      Swal.fire({
        title: `<span class="text-yruPink font-bold text-base">${title}</span>`,
        html: `
          <div class="text-left text-xs space-y-3">
            <p class="text-slate-400 text-[10px]">เวลาส่ง: ${time}</p>
            <div class="p-3 bg-slate-50 dark:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 whitespace-pre-line leading-relaxed">${message}</div>
          </div>
        `,
        confirmButtonText: "ปิดหน้าต่าง",
        confirmButtonColor: "#E66695"
      });
    }

    async function submitNotification() {
      const targetType = document.getElementById("sendTargetType").value;
      const targetValue = document.getElementById("sendTargetValue").value.trim();
      const title = document.getElementById("sendNotiTitle").value.trim();
      const message = document.getElementById("sendNotiMessage").value.trim();

      if (!title || !message) return Swal.fire("คำเตือน", "กรุณากรอกหัวข้อและข้อความ", "warning");

      Swal.showLoading();
      await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendNotification", targetType, targetValue, title, message })
      });
      Swal.fire("สำเร็จ", "ส่งการแจ้งเตือนเรียบร้อยแล้ว", "success");
      document.getElementById("sendNotiTitle").value = "";
      document.getElementById("sendNotiMessage").value = "";
      loadNotifications();
    }

    function filterNews(cat) { 
      currentFilter = cat; 
      document.querySelectorAll(".cat-btn").forEach(btn => {
        if (btn.textContent.trim() === cat) {
          btn.classList.add("bg-yruPink", "text-white");
          btn.classList.remove("bg-white", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-300");
        } else {
          btn.classList.remove("bg-yruPink", "text-white");
          btn.classList.add("bg-white", "dark:bg-slate-800", "text-slate-600", "dark:text-slate-300");
        }
      });
      loadPosts(); 
    }
    
    function logout() { localStorage.removeItem("app_user"); location.reload(); }
    function scrollToLogin() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  </script>
