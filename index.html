<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบริการออนไลน์ - YRU Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { yruPink: '#E66695', yruPinkHover: '#d45281' } } }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-700 dark:text-slate-200 min-h-screen flex flex-col justify-between relative overflow-x-hidden transition-colors">

  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="text-slate-600 dark:text-slate-300 hover:text-yruPink focus:outline-none p-1">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-xs border border-amber-400 shadow-sm">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-xl text-yruPink tracking-tight">YRU</span>
        </div>
      </div>

      <div class="flex items-center gap-2 md:gap-3">
        <button onclick="toggleDarkMode()" class="p-2 text-slate-500 dark:text-amber-400 hover:text-yruPink focus:outline-none">
          <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
        </button>

        <div id="navUserArea">
          <button onclick="scrollToLogin()" class="bg-yruPink hover:bg-yruPinkHover text-white px-4 py-1.5 rounded-md text-sm font-medium transition shadow-sm">
            เข้าสู่ระบบ
          </button>
        </div>

        <button id="navLogoutBtn" onclick="logout()" class="hidden p-2 text-rose-500 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-slate-700 rounded-full transition focus:outline-none" title="ออกจากระบบ">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <div id="sidebarBackdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>
  <aside id="sidebar" class="fixed top-0 left-0 w-72 h-full bg-white dark:bg-slate-800 z-50 shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-y-auto">
    <div>
      <div class="p-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-700">
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 rounded-full bg-emerald-700 text-amber-300 flex items-center justify-center font-bold text-sm border border-amber-400">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="font-bold text-2xl text-yruPink tracking-wide">YRU</span>
        </div>
        <button onclick="toggleSidebar()" class="text-yruPink text-xl hover:text-slate-400 p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="p-3 space-y-1">
        <a href="#" onclick="toggleSidebar()" class="flex items-center gap-3 px-4 py-2.5 text-slate-700 dark:text-slate-200 hover:text-yruPink hover:bg-pink-50 dark:hover:bg-slate-700 rounded-lg text-sm font-bold transition">
          <i class="fa-solid fa-house text-yruPink w-5"></i> หน้าแรก
        </a>

        <div id="sidebarUserMenuSection" class="pt-3 border-t border-slate-100 dark:border-slate-700">
          <p class="px-4 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">เมนูบริการตามสิทธิ์</p>
          <div id="sidebarUserMenus" class="space-y-1"></div>
        </div>
      </nav>
    </div>
  </aside>

  <main class="flex-1 max-w-4xl mx-auto w-full p-4 my-4">

    <div id="loginView" class="max-w-md mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-md overflow-hidden border border-slate-200 dark:border-slate-700">
      <div class="bg-yruPink text-white px-5 py-3.5 flex items-center gap-2">
        <i class="fa-solid fa-right-to-bracket text-base"></i>
        <h2 class="font-medium text-sm md:text-base">กรุณาป้อนรหัสประจำตัวและชื่อ-นามสกุล</h2>
      </div>

      <div class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">รหัสประจำตัว</label>
          <input type="text" id="loginUserId" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-yruPink" placeholder="เช่น 6601001">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">ชื่อ - นามสกุล</label>
          <input type="text" id="loginFullName" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:border-yruPink" placeholder="เช่น สมชาย ใจดี">
        </div>

        <button onclick="handleLogin()" class="bg-yruPink hover:bg-yruPinkHover text-white font-medium text-sm px-6 py-2 rounded-md transition shadow-sm">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>

    <div id="dashboardView" class="hidden space-y-6">

      <div id="adminPanel" class="hidden space-y-4">
        <div class="bg-gradient-to-r from-yruPink to-pink-600 text-white p-4 rounded-xl shadow-sm flex justify-between items-center">
          <div>
            <h2 class="font-bold text-base flex items-center gap-2"><i class="fa-solid fa-user-shield"></i> แผงควบคุมผู้ดูแลระบบ (Admin Panel)</h2>
            <p class="text-xs opacity-90">จัดการข้อมูลผู้ใช้งาน เมนู และตรวจสอบโพสต์ทั้งหมดในระบบ</p>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-users text-yruPink"></i> จัดการผู้ใช้งาน (Users)</h3>
            <button onclick="openUsersCRUDModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>

          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-bars-staggered text-yruPink"></i> จัดการเมนูระบบ (Menus)</h3>
            <button onclick="openMenusCRUDModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>

          <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-center space-y-2">
            <h3 class="font-bold text-xs text-slate-800 dark:text-slate-100"><i class="fa-solid fa-newspaper text-yruPink"></i> ตรวจสอบโพสต์ (Posts)</h3>
            <button onclick="openPostsAuditModal()" class="w-full bg-yruPink text-white text-xs font-bold py-2 rounded-lg hover:bg-yruPinkHover">เปิดตาราง CRUD</button>
          </div>
        </div>
      </div>

      <section id="serviceMenuSection" class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
        <button onclick="toggleMenuDrawer()" class="w-full p-4 flex justify-between items-center text-left focus:outline-none bg-slate-50 dark:bg-slate-700/50">
          <h2 class="text-sm font-bold text-yruPink flex items-center gap-2">
            <i class="fa-solid fa-grip"></i> เมนูบริการระบบ
          </h2>
          <i id="menuDrawerIcon" class="fa-solid fa-chevron-up text-xs text-slate-400 transition-transform"></i>
        </button>
        <div id="menuDrawerContent" class="p-5 border-t border-slate-100 dark:border-slate-700">
          <div id="dynamicMenuGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
        </div>
      </section>

      <section class="space-y-4">
        <div class="flex justify-between items-center">
          <div class="flex space-x-2 overflow-x-auto pb-1">
            <button onclick="filterNews('ทั้งหมด')" class="bg-yruPink text-white px-3 py-1 rounded-full text-xs font-semibold">ทั้งหมด</button>
            <button onclick="filterNews('ข่าวประกาศ')" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">ข่าวประกาศ</button>
            <button onclick="filterNews('กิจกรรม')" class="bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 px-3 py-1 rounded-full text-xs font-semibold hover:bg-slate-100">กิจกรรม</button>
          </div>
          <button onclick="openCreatePostModal()" class="bg-yruPink hover:bg-yruPinkHover text-white text-xs font-bold px-3.5 py-1.5 rounded-full shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> โพสต์ข่าว
          </button>
        </div>

        <div id="newsFeed" class="space-y-4"></div>
      </section>

    </div>

  </main>

  <footer class="p-4 text-xs text-slate-400 max-w-4xl mx-auto w-full flex justify-between items-center">
    <span>@ 2026 <strong class="text-yruPink font-semibold">Visionnet</strong></span>
    <span id="lastUpdateLabel" class="text-[10px]">Last Update: --/--/---- --:--</span>
  </footer>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwuwoxbcH8sYL7HjW9fMJrBs-Mmw7YP2JbYrdxl66XyJL28FOiIGaTSXx9QMl54uBimpw/exec"; // <--- เปลี่ยนเป็น URL Web App ของคุณ
    const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/847/847969.png";
    let currentUser = null;
    let currentFilter = "ทั้งหมด";
    let loadedPostsData = [];

    window.onload = () => {
      const now = new Date();
      document.getElementById("lastUpdateLabel").textContent = "Last Update " + now.toLocaleDateString('th-TH') + " " + now.toLocaleTimeString('th-TH', {hour: '2-digit', minute:'2-digit'});

      const savedUser = localStorage.getItem("app_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showDashboard();
      }
    };

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarBackdrop').classList.toggle('hidden');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById("themeIcon");
      if (html.classList.contains("dark")) {
        html.classList.remove("dark");
        icon.className = "fa-solid fa-moon text-lg";
      } else {
        html.classList.add("dark");
        icon.className = "fa-solid fa-sun text-lg text-amber-400";
      }
    }

    function toggleMenuDrawer() {
      document.getElementById("menuDrawerContent").classList.toggle("hidden");
      document.getElementById("menuDrawerIcon").classList.toggle("rotate-180");
    }

    // Convert plain text links to clickable <a> tags (open in new tab)
    function formatTextWithLinks(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      return text.replace(urlRegex, url => `<a href="${url}" target="_blank" class="text-yruPink font-semibold underline hover:text-yruPinkHover">${url}</a>`);
    }

    // Lightbox Image Modal
    function openImageModal(imgSrc) {
      Swal.fire({
        imageUrl: imgSrc,
        imageAlt: 'Preview Image',
        showConfirmButton: false,
        showCloseButton: true,
        background: 'rgba(0, 0, 0, 0.85)',
        customClass: { image: 'max-h-[85vh] rounded-lg object-contain' }
      });
    }

    async function handleLogin() {
      const userId = document.getElementById("loginUserId").value.trim();
      const fullName = document.getElementById("loginFullName").value.trim();
      if (!userId || !fullName) return Swal.fire("แจ้งเตือน", "กรุณากรอกรหัสประจำตัวและชื่อ-นามสกุล", "warning");

      Swal.showLoading();
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "checkLogin", userId, fullName })
      });
      const data = await res.json();
      Swal.close();

      if (data.success) {
        currentUser = data.userData;
        localStorage.setItem("app_user", JSON.stringify(currentUser));
        showDashboard();
      } else {
        Swal.fire("ข้อผิดพลาด", data.message, "error");
      }
    }

    function showDashboard() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("dashboardView").classList.remove("hidden");
      document.getElementById("navLogoutBtn").classList.remove("hidden");

      renderUserHeader();

      // IF ADMIN: Hide Service Menus
      if (currentUser.role === 'ADMIN') {
        document.getElementById("adminPanel").classList.remove("hidden");
        document.getElementById("serviceMenuSection").classList.add("hidden");
        document.getElementById("sidebarUserMenuSection").classList.add("hidden");
      } else {
        loadMenus();
      }

      loadPosts();
    }

    function renderUserHeader() {
      const avatarSrc = currentUser.avatar || DEFAULT_AVATAR;
      document.getElementById("navUserArea").innerHTML = `
        <button onclick="openUserProfileModal()" class="flex items-center gap-2 bg-pink-50 dark:bg-slate-700 hover:bg-pink-100 p-1.5 pr-3 rounded-full transition border border-pink-200 dark:border-slate-600">
          <img src="${avatarSrc}" class="w-7 h-7 rounded-full object-cover border border-yruPink" />
          <span class="text-xs font-bold text-yruPink">${currentUser.name}</span>
        </button>
      `;
    }

    // Modal Profile + Image Preview
    function openUserProfileModal() {
      const avatarSrc = currentUser.avatar || DEFAULT_AVATAR;
      Swal.fire({
        title: "ข้อมูลโปรไฟล์ส่วนตัว",
        html: `
          <div class="space-y-3 text-left text-xs">
            <div class="text-center">
              <img id="profilePreviewImg" src="${avatarSrc}" class="w-24 h-24 rounded-full object-cover mx-auto mb-2 border-2 border-yruPink shadow" />
              <input type="file" id="editAvatarFile" accept="image/*" onchange="previewImage(this, 'profilePreviewImg')" class="text-[11px] text-slate-500">
            </div>
            <div>
              <label class="font-semibold text-slate-500">รหัสประจำตัว</label>
              <input type="text" value="${currentUser.id}" disabled class="w-full p-2 bg-slate-100 border rounded mt-1">
            </div>
            <div>
              <label class="font-semibold text-slate-500">ชื่อ-นามสกุล</label>
              <input type="text" value="${currentUser.name}" disabled class="w-full p-2 bg-slate-100 border rounded mt-1">
            </div>
          </div>
        `,
        showCancelButton: true,
        confirmButtonText: "บันทึกรูปโปรไฟล์",
        confirmButtonColor: "#E66695",
        preConfirm: async () => {
          const fileInput = document.getElementById("editAvatarFile").files[0];
          if (!fileInput) return true;

          const avatarBase64 = await new Promise(r => {
            const reader = new FileReader();
            reader.onload = () => r(reader.result);
            reader.readAsDataURL(fileInput);
          });

          Swal.showLoading();
          const res = await fetch(GAS_API_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "updateUserProfile",
              userId: currentUser.id,
              currentAvatar: currentUser.avatar,
              avatarBase64: avatarBase64,
              avatarName: fileInput.name
            })
          });
          const data = await res.json();
          if (data.success) {
            currentUser.avatar = data.avatarUrl;
            localStorage.setItem("app_user", JSON.stringify(currentUser));
            renderUserHeader();
          }
        }
      });
    }

    // Preview File Input Function
    function previewImage(input, targetImgId) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const target = document.getElementById(targetImgId);
          target.src = e.target.result;
          target.classList.remove('hidden');
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    // Load Menus for Non-Admin
    async function loadMenus() {
      const grid = document.getElementById("dynamicMenuGrid");
      const sidebarNav = document.getElementById("sidebarUserMenus");

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getMenus", userRole: currentUser.role })
      });
      const data = await res.json();

      if (data.success && data.menus.length > 0) {
        grid.innerHTML = data.menus.map(menu => renderMenuButton(menu, false)).join('');
        sidebarNav.innerHTML = data.menus.map(menu => renderMenuButton(menu, true)).join('');
      } else {
        grid.innerHTML = "<p class='text-xs text-slate-400 col-span-full'>ไม่มีเมนูสำหรับสิทธิ์ของคุณ</p>";
      }
    }

    function renderMenuButton(menu, isSidebar) {
      let link = menu.url;
      if (!menu.isDirect) {
        const sep = link.includes('?') ? '&' : '?';
        link += `${sep}id=${encodeURIComponent(currentUser.id)}`;
      }

      if (isSidebar) {
        return `
          <a href="${link}" target="_blank" onclick="toggleSidebar()" class="flex items-center gap-3 px-4 py-2 text-slate-600 dark:text-slate-300 hover:text-yruPink hover:bg-pink-50 dark:hover:bg-slate-700 rounded-lg text-xs font-medium transition">
            <i class="${menu.icon || 'fa-solid fa-link'} text-yruPink w-4"></i> ${menu.name}
          </a>
        `;
      }

      return `
        <a href="${link}" target="_blank" class="flex flex-col items-center p-3 bg-slate-50 dark:bg-slate-700/50 hover:bg-pink-50 border border-slate-200 dark:border-slate-600 hover:border-yruPink rounded-xl transition group text-center">
          <div class="w-10 h-10 rounded-lg bg-pink-100 text-yruPink flex items-center justify-center text-lg mb-1.5 group-hover:bg-yruPink group-hover:text-white transition">
            <i class="${menu.icon || 'fa-solid fa-link'}"></i>
          </div>
          <span class="font-bold text-xs text-slate-700 dark:text-slate-200 group-hover:text-yruPink">${menu.name}</span>
        </a>
      `;
    }

    // Load News Feed & Render Posts
    async function loadPosts() {
      const feed = document.getElementById("newsFeed");
      if (loadedPostsData.length === 0) feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>กำลังโหลดข่าวสาร...</p>";

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "getPosts", categoryFilter: currentFilter })
      });
      const data = await res.json();

      if (data.success) {
        loadedPostsData = data.posts;
        renderPostsFeed();
      }
    }

    function renderPostsFeed() {
      const feed = document.getElementById("newsFeed");
      if (loadedPostsData.length === 0) {
        feed.innerHTML = "<p class='text-xs text-slate-400 text-center py-4'>ไม่พบข่าวสาร</p>";
        return;
      }

      feed.innerHTML = loadedPostsData.map(post => {
        const isLiked = post.likes.includes(currentUser.id);
        const isOwnerOrAdmin = post.userId == currentUser.id || currentUser.role === 'ADMIN';
        const postAvatar = post.authorAvatar || DEFAULT_AVATAR;

        return `
          <div id="postCard_${post.postId}" class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-3">
            
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-2.5">
                <img src="${postAvatar}" class="w-9 h-9 rounded-full object-cover border border-yruPink" />
                <div>
                  <h4 class="font-bold text-slate-800 dark:text-slate-100 text-xs">${post.authorName}</h4>
                  <p class="text-[10px] text-slate-400">${post.createdAt}</p>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <span class="bg-pink-100 text-yruPink text-[10px] px-2.5 py-0.5 rounded-full font-bold">${post.category}</span>
                ${isOwnerOrAdmin ? `
                  <button onclick="editPostModal('${post.postId}')" class="text-xs text-slate-400 hover:text-yruPink"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button onclick="deletePostConfirm('${post.postId}')" class="text-xs text-slate-400 hover:text-rose-500"><i class="fa-solid fa-trash"></i></button>
                ` : ''}
              </div>
            </div>

            <p class="text-xs text-slate-700 dark:text-slate-200 whitespace-pre-line leading-relaxed">${formatTextWithLinks(post.content)}</p>

            ${post.imageUrl ? `
              <img src="${post.imageUrl}" onclick="openImageModal('${post.imageUrl}')" class="w-full h-auto rounded-xl border max-h-96 object-cover cursor-pointer hover:opacity-95 transition" />
            ` : ''}
            
            <div class="pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between text-xs text-slate-500">
              <button onclick="smoothToggleLike('${post.postId}')" class="flex items-center gap-1.5 ${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'} transition">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                <span id="likeCount_${post.postId}">${post.likes.length} ถูกใจ</span>
              </button>
              <span class="text-slate-400" id="commentCount_${post.postId}">${post.comments.length} ความคิดเห็น</span>
            </div>

            <div id="commentsContainer_${post.postId}" class="space-y-2 pt-2 border-t border-slate-50 dark:border-slate-700">
              ${renderCommentsTree(post)}
            </div>

            <div class="space-y-2 pt-2">
              <div class="flex gap-2 items-center">
                <img src="${currentUser.avatar || DEFAULT_AVATAR}" class="w-7 h-7 rounded-full object-cover border" />
                <input type="text" id="commentInput_${post.postId}" class="flex-1 p-2 text-xs border dark:bg-slate-700 dark:border-slate-600 rounded-lg focus:outline-none focus:border-yruPink" placeholder="เขียนความคิดเห็น...">
                <label class="cursor-pointer text-slate-400 hover:text-yruPink px-1">
                  <i class="fa-solid fa-image text-base"></i>
                  <input type="file" id="commentImg_${post.postId}" accept="image/*" onchange="previewImage(this, 'commentImgPreview_${post.postId}')" class="hidden">
                </label>
                <button onclick="smoothSubmitComment('${post.postId}')" class="bg-yruPink hover:bg-yruPinkHover text-white text-xs px-3 py-1.5 rounded-lg font-bold transition">ส่ง</button>
              </div>
              <img id="commentImgPreview_${post.postId}" class="hidden w-16 h-16 object-cover rounded-lg border border-yruPink ml-9" />
            </div>

          </div>
        `;
      }).join('');

    // Facebook-style Comment Tree Render
    function renderCommentsTree(post, parentId = null) {
      const comments = post.comments.filter(c => (c.parentId || null) === parentId);
      if (comments.length === 0) return '';

      return comments.map(c => {
        const isLiked = (c.likes || []).includes(currentUser.id);
        const canDelete = c.userId == currentUser.id || currentUser.role === 'ADMIN';
        const commentAvatar = c.authorAvatar || DEFAULT_AVATAR;

        return `
          <div class="text-xs ${parentId ? 'ml-8 mt-2' : ''} flex gap-2 items-start">
            <img src="${commentAvatar}" class="w-6 h-6 rounded-full object-cover border border-yruPink mt-1" />
            <div class="flex-1 space-y-1">
              <div class="bg-slate-100 dark:bg-slate-700/60 p-2.5 rounded-2xl inline-block max-w-full">
                <strong class="text-yruPink font-bold block text-[11px]">${c.authorName}</strong>
                <span class="text-slate-700 dark:text-slate-200 whitespace-pre-line">${formatTextWithLinks(c.text)}</span>
                ${c.imageUrl ? `<img src="${c.imageUrl}" onclick="openImageModal('${c.imageUrl}')" class="w-32 h-32 object-cover rounded-lg border mt-1 cursor-pointer" />` : ''}
              </div>

              <div class="flex items-center gap-3 text-[10px] text-slate-400 pl-2">
                <span>${c.time}</span>
                <button onclick="smoothToggleLikeComment('${post.postId}', '${c.commentId}')" class="${isLiked ? 'text-rose-500 font-bold' : 'hover:text-rose-500'}">
                  ถูกใจ ${(c.likes || []).length > 0 ? `(${c.likes.length})` : ''}
                </button>
                <button onclick="toggleReplyBox('${c.commentId}')" class="hover:text-yruPink font-semibold">ตอบกลับ</button>
                ${canDelete ? `<button onclick="smoothDeleteComment('${post.postId}', '${c.commentId}')" class="hover:text-rose-500">ลบ</button>` : ''}
              </div>

              <div id="replyBox_${c.commentId}" class="hidden flex gap-2 items-center pt-1 pl-2">
                <input type="text" id="replyInput_${c.commentId}" class="flex-1 p-1 text-[11px] border rounded focus:outline-none focus:border-yruPink dark:bg-slate-700" placeholder="ตอบกลับ ${c.authorName}...">
                <button onclick="smoothSubmitComment('${post.postId}', '${c.commentId}')" class="bg-yruPink text-white text-[10px] px-2.5 py-1 rounded font-bold">ส่ง</button>
              </div>

              ${renderCommentsTree(post, c.commentId)}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleReplyBox(commentId) {
      document.getElementById(`replyBox_${commentId}`).classList.toggle('hidden');
    }

    // Smooth Actions (No Full Reload)
    async function smoothToggleLike(postId) {
      const post = loadedPostsData.find(p => p.postId === postId);
      if (!post) return;

      const idx = post.likes.indexOf(currentUser.id);
      if (idx > -1) post.likes.splice(idx, 1);
      else post.likes.push(currentUser.id);

      const countLabel = document.getElementById(`likeCount_${postId}`);
      if (countLabel) countLabel.textContent = `${post.likes.length} ถูกใจ`;

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLike", postId, userId: currentUser.id })
      });
    }

    async function smoothSubmitComment(postId, parentId = null) {
      let input, imgInput;
      if (parentId) {
        input = document.getElementById(`replyInput_${parentId}`);
      } else {
        input = document.getElementById(`commentInput_${postId}`);
        imgInput = document.getElementById(`commentImg_${postId}`);
      }

      const text = input.value.trim();
      const imageFile = imgInput ? imgInput.files[0] : null;
      if (!text && !imageFile) return;

      let imageBase64 = "", imageName = "";
      if (imageFile) {
        imageBase64 = await new Promise(r => {
          const reader = new FileReader();
          reader.onload = () => r(reader.result);
          reader.readAsDataURL(imageFile);
        });
        imageName = imageFile.name;
      }

      input.value = "";
      if (imgInput) imgInput.value = "";

      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "addComment", postId, parentId,
          commentText: text, imageBase64, imageName,
          userId: currentUser.id, authorName: currentUser.name, authorAvatar: currentUser.avatar
        })
      });
      const data = await res.json();

      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
        document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
      }
    }

    async function smoothToggleLikeComment(postId, commentId) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "toggleLikeComment", postId, commentId, userId: currentUser.id })
      });
      const data = await res.json();

      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
      }
    }

    async function smoothDeleteComment(postId, commentId) {
      const res = await fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "deleteComment", postId, commentId,
          userId: currentUser.id, userRole: currentUser.role
        })
      });
      const data = await res.json();

      if (data.success) {
        const post = loadedPostsData.find(p => p.postId === postId);
        post.comments = data.comments;
        document.getElementById(`commentsContainer_${postId}`).innerHTML = renderCommentsTree(post);
        document.getElementById(`commentCount_${postId}`).textContent = `${post.comments.length} ความคิดเห็น`;
      }
    }
